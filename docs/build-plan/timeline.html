<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Build plan</title>
<style>
  :root {
    --bg: #eef1f4; --surface: #ffffff; --ink: #18232e; --muted: #5a6876; --rule: #d3dae1;
    --proto: #1662d6; --mvp: #7b3fe4; --done: #17803d; --doing: #c26a00; --blocked: #c62b3a;
    --chip: #e7ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f151b; --surface: #17202a; --ink: #e4ebf2; --muted: #93a2b1; --rule: #2a3643;
      --proto: #5b9bff; --mvp: #a983ff; --done: #4cc47a; --doing: #f0a347; --blocked: #ff6b7a; --chip: #223040; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 30px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .progress { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .bar { flex: 1; height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; display: flex; }
  .bar span { display: block; height: 100%; }
  .progress b { font-size: 15px; white-space: nowrap; }
  .spine { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
  .exit { background: var(--surface); border-radius: 10px; padding: 14px 16px; border-left: 4px solid var(--proto); }
  .exit.mvp { border-left-color: var(--mvp); }
  .exit h2 { font-size: 15px; margin: 0 0 6px; }
  .exit ul { margin: 0; padding-left: 18px; color: var(--muted); }
  .risks { grid-column: 1 / -1; background: var(--surface); border-radius: 10px; padding: 12px 16px; color: var(--muted); }
  .risks strong { color: var(--ink); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filters button { font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 16px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--surface); color: var(--ink); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .line { position: relative; padding-left: 46px; }
  .phase-label { position: relative; font-weight: 650; font-size: 17px; margin: 22px 0 12px; }
  .phase-label small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 8px; }
  .stop { position: relative; margin-bottom: 12px; }
  .stop::before { content: ""; position: absolute; left: -31px; top: -12px; bottom: -12px; width: 6px;
    background: var(--c); }
  .stop.first::before { top: 22px; }
  .stop.last::before { bottom: calc(100% - 22px); }
  .dot { position: absolute; left: -39px; top: 13px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--surface); border: 5px solid var(--c); }
  .stop.done .dot { background: var(--c); }
  .stop.milestone .dot { width: 30px; height: 30px; left: -43px; top: 9px; border-width: 6px; }
  .card { background: var(--surface); border-radius: 10px; padding: 12px 16px; cursor: pointer; border: 1px solid transparent; }
  .card:hover, .card:focus-visible { border-color: var(--c); outline: none; }
  .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .id { font-weight: 700; color: var(--c); }
  .title { font-weight: 600; }
  .status { margin-left: auto; font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--chip); color: var(--muted); }
  .status.done { color: var(--done); } .status.in-progress { color: var(--doing); } .status.blocked { color: var(--blocked); }
  .goal { margin: 4px 0 8px; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; color: var(--muted); }
  .chip.skill { color: var(--ink); }
  .details { display: none; margin-top: 12px; border-top: 1px solid var(--rule); padding-top: 10px; font-size: 14px; }
  .card[aria-expanded="true"] .details { display: block; }
  .details p { margin: 0; }
  a { color: var(--proto); }
  .details h3 { font-size: 13px; margin: 10px 0 3px; color: var(--muted); font-weight: 600; }
  .details ul, .details ol { margin: 0; padding-left: 20px; }
  .details code { font-size: 12.5px; }
  .hidden { display: none; }
  .open { margin-top: 30px; background: var(--surface); border-radius: 10px; padding: 14px 16px; }
  .open h2 { font-size: 15px; margin: 0 0 6px; }
  @media (max-width: 640px) { .spine { grid-template-columns: 1fr; } h1 { font-size: 24px; } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: border-color .15s; } }
</style>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = (a, tag = "ul") => a && a.length ? `<${tag}>${a.map(x => `<li>${esc(x)}</li>`).join("")}</${tag}>` : "<p>—</p>";
const steps = (PLAN.steps || []).filter(s => s.status !== "cut");
const done = steps.filter(s => s.status === "done").length;
const doing = steps.filter(s => s.status === "in-progress").length;
const pct = n => steps.length ? (100 * n / steps.length) : 0;
const hours = steps.reduce((a, s) => a + (+s.estimate_hours || 0), 0);
document.title = `${PLAN.project || "Project"} build plan`;

function stepHTML(s, i, arr) {
  const c = s.phase === "mvp" ? "var(--mvp)" : "var(--proto)";
  const cls = ["stop", s.status, s.milestone ? "milestone" : "", i === 0 ? "first" : "", i === arr.length - 1 ? "last" : ""].join(" ");
  const ms = s.milestone === "prototype-exit" ? " 🏁 prototype exit" : s.milestone === "mvp-exit" ? " 🏁 MVP exit" : "";
  const tags = [...(s.use_cases || []), ...(s.screens || [])].map(t => `<span class="chip">${esc(t)}</span>`).join("");
  const skills = (s.skills || []).map(k => `<span class="chip skill">${esc(k.name || k)}</span>`).join("");
  return `<div class="${cls}" data-status="${esc(s.status || "todo")}" style="--c:${c}">
    <span class="dot" aria-hidden="true"></span>
    <div class="card" tabindex="0" role="button" aria-expanded="false">
      <div class="head"><span class="id">${esc(s.id)}</span><span class="title">${esc(s.title)}${ms}</span>
        <span class="status ${esc(s.status || "todo")}">${esc(s.status || "todo")}</span></div>
      <p class="goal">${esc(s.goal)}</p>
      <div class="meta">${tags}${skills}${s.estimate_hours ? `<span class="chip">~${esc(s.estimate_hours)} h</span>` : ""}${s.track ? `<span class="chip">track ${esc(s.track)}</span>` : ""}</div>
      <div class="details">
        ${s.why_now ? `<h3>Why now</h3><p>${esc(s.why_now)}</p>` : ""}
        <h3>Done when (on the public URL)</h3>${list(s.done_check, "ol")}
        <h3>Skills, in order</h3>${(s.skills || []).length ? `<ol>${s.skills.map(k => `<li><b>${esc(k.name || k)}</b>${k.use ? ` — ${esc(k.use)}` : ""}</li>`).join("")}</ol>` : "<p>—</p>"}
        <h3>In scope</h3>${list(s.scope_in)}
        <h3>Out of scope</h3>${list(s.scope_out)}
        ${s.fallback ? `<h3>If it goes wrong</h3><p>${esc(s.fallback)}</p>` : ""}
        <h3>Deploys</h3><p>${esc((s.deploys || []).join(", "))}${(s.depends_on || []).length ? ` · after ${esc(s.depends_on.join(", "))}` : ""}</p>
        <h3>Prompt</h3><p><code>prompts/${esc(s.id)}-…md</code></p>
      </div>
    </div></div>`;
}

const sp = PLAN.spine || {};

    <div class="exit"><h2>Prototype is done when</h2>${list(sp.prototype_exit)}</div>
    <div class="exit mvp"><h2>MVP is done when</h2>${list(sp.mvp_exit)}</div>
    ${(sp.risks || []).length ? `<div class="risks"><strong>Riskiest unknowns:</strong> ${sp.risks.map(r => `${esc(r.risk)} (${esc(r.step)})`).join("; ")}</div>` : ""}
  </section>
  <div class="filters" role="group" aria-label="Filter by status">
    ${["all", "todo", "in-progress", "done", "blocked"].map(f => `<button data-f="${f}" aria-pressed="${f === "all"}">${f === "all" ? "All steps" : f}</button>`).join("")}
  </div>
  <div class="line">
    <div class="phase-label" style="color:var(--proto)">Prototype<small>${proto.length} steps</small></div>
    ${proto.map(stepHTML).join("")}
    ${mvp.length ? `<div class="phase-label" style="color:var(--mvp)">MVP<small>${mvp.length} steps</small></div>${mvp.map(stepHTML).join("")}` : ""}
  </div>
  ${(PLAN.open_questions || []).length ? `<section class="open"><h2>Open questions and assumptions</h2>${list(PLAN.open_questions)}</section>` : ""}`;

document.querySelectorAll(".card").forEach(c => {
  const toggle = () => c.setAttribute("aria-expanded", c.getAttribute("aria-expanded") !== "true");
  c.addEventListener("click", e => { if (!e.target.closest("a")) toggle(); });
  c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
});
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.querySelectorAll(".stop").forEach(s => s.classList.toggle("hidden", b.dataset.f !== "all" && s.dataset.status !== b.dataset.f));
}));
</script>
</body>
</html>
