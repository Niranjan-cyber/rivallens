<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RivalLens (working name) Journey Map</title>
<style>
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --surface-2: #f0eee8; --text: #1d1c1a; --muted: #6b6860;
    --border: #e2dfd6; --accent: #3a5bd9; --accent-soft: #e5eafc; --pain: #b4372c; --pain-soft: #fbe9e7;
    --opp: #22744a; --opp-soft: #e4f3ea; --pos: #22744a; --neg: #b4372c; --shadow: 0 1px 2px rgba(0,0,0,.06);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --surface: #1f1f1d; --surface-2: #2a2a27; --text: #ecebe6; --muted: #a29f96;
      --border: #383733; --accent: #8ea4ff; --accent-soft: #262e4d; --pain: #f08a7e; --pain-soft: #3a2422;
      --opp: #7fd3a2; --opp-soft: #1f3529; --pos: #7fd3a2; --neg: #f08a7e; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151514; --surface: #1f1f1d; --surface-2: #2a2a27; --text: #ecebe6; --muted: #a29f96;
    --border: #383733; --accent: #8ea4ff; --accent-soft: #262e4d; --pain: #f08a7e; --pain-soft: #3a2422;
    --opp: #7fd3a2; --opp-soft: #1f3529; --pos: #7fd3a2; --neg: #f08a7e; --shadow: none;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 1.15rem; margin: 36px 0 12px; }
  .tagline { color: var(--muted); margin: 0 0 20px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .tab { border: 1px solid var(--border); background: var(--surface); color: var(--text);
    padding: 8px 14px; border-radius: 999px; cursor: pointer; font: inherit; }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .persona { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--shadow);
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 20px; }
  .persona .who { grid-column: 1 / -1; font-weight: 600; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }
  .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
  .grid { display: grid; position: relative; min-width: max-content; width: 100%; }
  .cell { padding: 10px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); min-width: 210px; }
  .rowhead { position: sticky; left: 0; z-index: 2; background: var(--surface-2); min-width: 120px; max-width: 120px;
    font-size: .78rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stage-name { font-weight: 700; }
  .stage-goal { color: var(--muted); font-size: .88rem; }
  ul { margin: 0; padding-left: 18px; } li { margin: 2px 0; }
  .chip { display: inline-block; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft);
    border-radius: 6px; padding: 2px 8px; margin: 2px 4px 2px 0; font-size: .82rem; cursor: pointer; font-family: inherit; }
  .thinking { font-style: italic; }
  .pain li::marker { color: var(--pain); } .pain { background: var(--pain-soft); }
  .opp li::marker { color: var(--opp); } .opp { background: var(--opp-soft); }
  .emotion-cell { height: 96px; }
  .emotion-svg { position: absolute; pointer-events: none; z-index: 1; overflow: visible; }
  .screens { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .screen { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    box-shadow: var(--shadow); transition: outline-color .3s; outline: 2px solid transparent; }
  .screen.flash { outline-color: var(--accent); }
  .screen h3 { margin: 0 0 4px; font-size: 1rem; }
  .screen .id { color: var(--accent); font-weight: 700; margin-right: 6px; }
  .screen p { margin: 4px 0 8px; color: var(--muted); }
  .screen .label { display: block; margin-top: 8px; }
  .empty { color: var(--muted); padding: 24px; }
  footer { margin-top: 40px; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<main>
  <h1 id="title">Journey Map</h1>
  <p class="tagline" id="tagline"></p>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="persona"></div>
  <div class="scroll" id="scroll"><div class="grid" id="grid"></div></div>
  <h2>Screen inventory</h2>
  <div class="screens" id="screens"></div>
  <footer>Generated by user-journey-mapper. Emotion scale: -2 (frustrated) to +2 (delighted).</footer>
</main>

": "S-02", "name": "Sign up / Log in", "purpose": "Authenticate", "components": ["Sign up tab", "Log in tab", "Try demo account button"], "actions": ["Create account", "Log in", "Try demo account"], "use_cases": ["UC-01"]}, {"id": "S-03", "name": "Home (profiles)", "purpose": "Pick or create a business profile", "components": ["Profile cards with alerts and last run", "Demo-data badges", "+ New profile"], "actions": ["Open profile", "+ New profile"], "use_cases": ["UC-13", "UC-01"]}, {"id": "S-04", "name": "New profile: path and quick start", "purpose": "Choose business or idea and get an AI draft", "components": ["Two path cards", "URL or one-line box", "Fill manually link"], "actions": ["Draft my card", "Fill manually"], "use_cases": ["UC-02"]}, {"id": "S-05", "name": "Profile wizard", "purpose": "Confirm and complete the card in 3 steps", "components": ["Basics", "Offering: product vs service, price", "Priorities", "AI-drafted badges"], "actions": ["Next", "Finish", "Back"], "use_cases": ["UC-02"]}, {"id": "S-06", "name": "Card preview", "purpose": "Show the Business or Idea Card", "components": ["Card fields labelled by origin", "Unknown values"], "actions": ["Find competitors", "Edit card"], "use_cases": ["UC-02", "UC-03"]}, {"id": "S-07", "name": "Discovery in progress", "purpose": "Make automated discovery transparent", "components": ["Live step list with counts", "Candidate log with pass/fail reasons"], "actions": ["Cancel"], "use_cases": ["UC-03"]}, {"id": "S-08", "name": "Discovered competitors review", "purpose": "Confirm who to monitor", "components": ["Comparable and Inspiration tabs", "India signals", "Similarity", "Pages to watch", "Add competitor URL"], "actions": ["Start monitoring", "Add competitor URL", "Re-run discovery"], "use_cases": ["UC-03", "UC-11"]}, {"id": "S-09", "name": "Profile dashboard", "purpose": "Latest picture for the profile", "components": ["Stats", "Run monitor", "Recent receipts", "Simulator summary", "Comparison snapshot", "V <script>
(function () {
  var raw = document.getElementById('journey-data').textContent.trim();
  var data;
  try { data = JSON.parse(raw); } catch (e) { data = null; }
  if (!data) { document.getElementById('grid').innerHTML = '<div class="empty">No journey data found.</div>'; return; }

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function list(items) { if (!items || !items.length) return '<span class="stage-goal">-</span>';
    return '<ul>' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>'; }

  var screensById = {};
  (data.screens || []).forEach(function (s) { screensById[s.id] = s; });
  var personasById = {};
  (data.personas || []).forEach(function (p) { personasById[p.id] = p; });

  var project = data.project || {};
  document.getElementById('title').textContent = (project.name || 'Project') + ': Journey Map';
  document.title = (project.name || 'Project') + ' Journey Map';
  document.getElementById('tagline').textContent = project.tagline || '';

  var journeys = data.journeys || [];
  var current = 0;

  function renderTabs() {
    var tabs = document.getElementById('tabs');
    tabs.innerHTML = journeys.map(function (j, i) {
      var p = personasById[j.persona] || {};
      return '<button class="tab" role="tab" aria-selected="' + (i === current) + '" data-i="' + i + '">' +
        esc(p.name || j.persona) + (j.title ? ': ' + esc(j.title) : '') + '</button>';
    }).join('');
    tabs.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () { current = +b.dataset.i; render(); });
    });
  }

  function renderPersona(j) {
    var p = personasById[j.persona] || {};
    document.getElementById('persona').innerHTML =
      '<div class="persona"><div class="who">' + esc(p.name || j.persona) + ' · ' + esc(p.role || '') +
      (p.primary ? '<span class="badge">primary</span>' : '') + '</div>' +
      '<div><div class="label">Goal</div>' + esc(p.goal || '-') + '</div>' +
      '<div><div class="label">Context</div>' + esc(p.context || '-') + '</div>' +
      '<div><div class="label">Frustration today</div>' + esc(p.pain || '-') + '</div></div>';
  }

  function renderGrid(j) {
    var stages = j.stages || [];
    var grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = '120px repeat(' + stages.length + ', minmax(210px, 1fr))';
    var rows = [
      ['Stage', function (s) { return '<div class="stage-name">' + esc(s.name) + '</div><div class="stage-goal">' + esc(s.goal || '') + '</div>'; }, ''],
      ['Actions', function (s) { return list(s.actions); }, ''],
      ['Screens', function (s) { return (s.screens || []).map(function (id) {
        var sc = screensById[id]; return '<button class="chip" data-screen="' + esc(id) + '">' + esc(id) + (sc ? ' ' + esc(sc.name) : '') + '</button>'; }).join('') || '-'; }, ''],
      ['Thinking', function (s) { return s.thinking ? '<span class="thinking">"' + esc(s.thinking) + '"</span>' : '-'; }, ''],
      ['Emotion', function () { return ''; }, 'emotion-cell'],
      ['Pain points', function (s) { return list(s.pain_points); }, 'pain'],
      ['Opportunities', function (s) { return list(s.opportunities); }, 'opp']
    ];
    var html = '';
    rows.forEach(function (r) {
      html += '<div class="cell rowhead">' + r[0] + '</div>';
      stages.forEach(function (s, i) { html += '<div class="cell ' + r[2] + '" data-stage="' + i + '">' + r[1](s) + '</div>'; });
    });
    grid.innerHTML = html;
    grid.querySelectorAll('.chip').forEach(function (c) {
      c.addEventListener('click', function () { focusScreen(c.dataset.screen); });
    });
    drawEmotion(stages);
  }

  function drawEmotion(stages) {
    var grid = document.getElementById('grid');
    var cells = grid.querySelectorAll('.emotion-cell');
    if (!cells.length) return;
    var gridRect = grid.getBoundingClientRect();
    var first = cells[0].getBoundingClientRect();
    var top = first.top - gridRect.top, h = first.height;
    var pts = [];
    cells.forEach(function (c, i) {
      var r = c.getBoundingClientRect();
      var e = Math.max(-2, Math.min(2, Number(stages[i].emotion) || 0));
      pts.push({ x: r.left - gridRect.left + r.width / 2, y: top + h / 2 - (e / 2) * (h / 2 - 14), e: e });
    });
    var w = grid.scrollWidth;
    var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
    var svg = '<svg class="emotion-svg" width="' + w + '" height="' + grid.scrollHeight + '" style="left:0;top:0" aria-hidden="true">' +
      '<line x1="' + pts[0].x + '" x2="' + pts[pts.length - 1].x + '" y1="' + (top + h / 2) + '" y2="' + (top + h / 2) + '" stroke="var(--border)" stroke-dasharray="4 4"/>' +
      '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>' +
      pts.map(function (p) {
        var col = p.e > 0 ? 'var(--pos)' : p.e < 0 ? 'var(--neg)' : 'var(--muted)';
        return '<circle cx="' + p.x + '" cy="' + p.y + '" r="7" fill="var(--surface)" stroke="' + col + '" stroke-width="3"/>' +
          '<text x="' + (p.x + 12) + '" y="' + (p.y + 4) + '" font-size="12" fill="' + col + '">' + (p.e > 0 ? '+' : '') + p.e + '</text>';
      }).join('') + '</svg>';
    var old = grid.querySelector('.emotion-svg'); if (old) old.remove();
    grid.insertAdjacentHTML('beforeend', svg);
  }

  function renderScreens() {
    document.getElementById('screens').innerHTML = (data.screens || []).map(function (s) {
      return '<div class="screen" id="screen-' + esc(s.id) + '"><h3><span class="id">' + esc(s.id) + '</span>' + esc(s.name) + '</h3>' +
        '<p>' + esc(s.purpose || '') + '</p>' +
        '<span class="label">What\'s on it</span>' + list(s.components) +
        '<span class="label">Actions</span>' + list(s.actions) +
        (s.use_cases && s.use_cases.length ? '<span class="label">Serves</span>' + esc(s.use_cases.join(', ')) : '') + '</div>';
    }).join('');
  }

  function focusScreen(id) {
    var el = document.getElementById('screen-' + id);
    if (!el) return;
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1400);
  }

  function render() {
    if (!journeys.length) { document.getElementById('grid').innerHTML = '<div class="empty">No journeys defined.</div>'; return; }
    renderTabs(); renderPersona(journeys[current]); renderGrid(journeys[current]);
  }

  renderScreens(); render();
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(function () { drawEmotion(journeys[current].stages || []); }, 120); });
})();
</script>
</body>
</html>
